<style>
  html, body {
    margin: 0; padding: 0;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: #2a2620;
    color: #2D2017;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  @keyframes dot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); }
    40%           { opacity: 1;    transform: scale(1); }
  }
  @keyframes spinSlow {
    to { transform: rotate(360deg); }
  }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
</style>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakToggleInline({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

      width: '100%', minHeight: 80, padding: '0 28px',
      borderRadius: ctx.buttonShape === 'square' ? 16 : 999,
      border: isGhost ? `2.5px solid ${ctx.theme.accent}` : 'none',
      background: isPrimary ? ctx.theme.accent : isGhost ? 'transparent' : ctx.theme.bgSoft,
      color: isPrimary ? '#fff' : ctx.theme.accentDark,
      fontSize: fz(ctx, 24), fontWeight: 800, cursor: 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12,

              {ctx.history.filter(h => h.foodId).length}가지 음식을 추천받았어요
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {ctx.history.map((h, i) => {
            const f = FOODS.find(x => x.id === h.foodId);
            const empty = !f;
            return (
              <button key={i} onClick={() => !empty && ctx.openFood(f)}
                disabled={empty}
                style={{
                  background: empty ? ctx.theme.bgSoft : ctx.theme.card,
                  border: `1.5px solid ${ctx.theme.border}`,
                  borderRadius: 22, padding: 14, minHeight: 96,
                  display: 'flex', alignItems: 'center', gap: 16,
                  cursor: empty ? 'default' : 'pointer',
                  textAlign: 'left',
                }}>
                {empty ? (
                  <div style={{
                    width: 72, height: 72, borderRadius: 16,
                    border: `2px dashed ${ctx.theme.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: ctx.theme.textSoft, fontSize: 24,
                  }}>＋</div>
                ) : (
                  <div style={{ width: 72, height: 72, flexShrink: 0 }}>
                    <FoodPhoto food={f} size="small"/>
                  </div>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: fz(ctx, 17), color: ctx.theme.textSoft, fontWeight: 600 }}>
                    {h.date}
                  </div>
                  <div style={{ fontSize: fz(ctx, 22), color: ctx.theme.text, fontWeight: 800, marginTop: 2 }}>
                    {empty ? '아직 추천을 받지 않았어요' : f.name}
                  </div>
                </div>
                {!empty && (
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M9 5l7 7-7 7" stroke={ctx.theme.textSoft} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function HealthScreen({ ctx }) {
  const [conditions, setConditions] = React.useState(ctx.health.conditions);
  const [bp,    setBp]    = React.useState(ctx.health.bp);
  const [sugar, setSugar] = React.useState(ctx.health.sugar);

  const allConditions = [
    { id: 'bp',     label: '고혈압',  icon: '♥' },
    { id: 'sugar',  label: '당뇨',    icon: '◆' },
    { id: 'chol',   label: '고지혈증', icon: '◯' },
    { id: 'teeth',  label: '치아 약함', icon: '◐' },
    { id: 'kidney', label: '신장',    icon: '◑' },
    { id: 'none',   label: '없음',    icon: '✓' },
  ];

  const toggle = (id) => {
    setConditions(prev => {
      if (id === 'none') return ['none'];
      const next = prev.filter(x => x !== 'none');
      return next.includes(id) ? next.filter(x => x !== id) : [...next, id];
    });
  };

  const save = () => {
    ctx.setHealth({ conditions, bp, sugar });
    ctx.go('home');
  };

  return (
    <div data-screen-label="06 건강정보" style={{ minHeight: '100%', background: ctx.theme.bg }}>
      <TopBar ctx={ctx} title="내 건강 정보" onBack={() => ctx.go('home')} />

      <div style={{ padding: '18px 20px 28px' }}>
        <div style={{ fontSize: fz(ctx, 22), color: ctx.theme.text, fontWeight: 700, marginBottom: 8 }}>
          어떤 점에 신경 쓰시나요?
        </div>
        <div style={{ fontSize: fz(ctx, 17), color: ctx.theme.textSoft, marginBottom: 16 }}>
          여러 개 고르셔도 괜찮아요
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {allConditions.map(c => {
            const on = conditions.includes(c.id);
            return (
              <button key={c.id} onClick={() => toggle(c.id)} style={{
                background: on ? ctx.theme.accent : ctx.theme.card,
                color: on ? '#fff' : ctx.theme.text,
                border: `2px solid ${on ? ctx.theme.accent : ctx.theme.border}`,
                borderRadius: 20, padding: '20px 12px', minHeight: 104,
                cursor: 'pointer',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
              }}>
                <div style={{
                  width: 44, height: 44, borderRadius: 14,
                  background: on ? 'rgba(255,255,255,0.22)' : ctx.theme.bgSoft,
                  color: on ? '#fff' : ctx.theme.accentDark,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 24, fontWeight: 800,
                }}>{c.icon}</div>
                <div style={{ fontSize: fz(ctx, 20), fontWeight: 800 }}>{c.label}</div>
              </button>
            );
          })}
        </div>

        <div style={{ marginTop: 28, fontSize: fz(ctx, 22), fontWeight: 700, color: ctx.theme.text, marginBottom: 12 }}>
          최근 측정 값 (선택)
        </div>

        <NumberField ctx={ctx} label="혈압 (수축기)" value={bp} setValue={setBp} unit="mmHg" />
        <div style={{ height: 12 }}/>
        <NumberField ctx={ctx} label="혈당" value={sugar} setValue={setSugar} unit="mg/dL" />

        <div style={{ marginTop: 28 }}>
          <BigButton ctx={ctx} onClick={save}>저장하기</BigButton>
        </div>
      </div>
    </div>
  );
}

function NumberField({ ctx, label, value, setValue, unit }) {
  return (
    <div style={{
      background: ctx.theme.card, borderRadius: 20,
      border: `1.5px solid ${ctx.theme.border}`,
      padding: '14px 14px 14px 20px',
      display: 'flex', alignItems: 'center', gap: 12,
    }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: fz(ctx, 17), color: ctx.theme.textSoft, fontWeight: 600 }}>{label}</div>
        <div style={{ fontSize: fz(ctx, 32), fontWeight: 800, color: ctx.theme.text }}>
          {value} <span style={{ fontSize: fz(ctx, 18), color: ctx.theme.textSoft, fontWeight: 600 }}>{unit}</span>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => setValue(v => Math.max(0, v - 1))}
          aria-label="줄이기"
          style={{
            width: 64, height: 64, borderRadius: 16, border: 'none',
            background: ctx.theme.bgSoft, color: ctx.theme.accentDark,
            fontSize: 32, fontWeight: 800, cursor: 'pointer',
          }}>−</button>
        <button onClick={() => setValue(v => v + 1)}
          aria-label="늘리기"
          style={{
            width: 64, height: 64, borderRadius: 16, border: 'none',
            background: ctx.theme.accent, color: '#fff',
            fontSize: 32, fontWeight: 800, cursor: 'pointer',
          }}>＋</button>
      </div>
    </div>
  );
}

function SettingsScreen({ ctx }) {
  return (
    <div data-screen-label="07 설정" style={{ minHeight: '100%', background: ctx.theme.bg }}>
      <TopBar ctx={ctx} title="설정" onBack={() => ctx.go('home')} />

      <div style={{ padding: '18px 20px 28px' }}>
        <SectionHeader ctx={ctx} text="글씨 크기" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
          {Object.entries(SIZE_SCALE).map(([k, v]) => {
            const on = ctx.fontKey === k;
            return (
              <button key={k} onClick={() => ctx.setFontKey(k)} style={{
                background: on ? ctx.theme.accent : ctx.theme.card,
                color: on ? '#fff' : ctx.theme.text,
                border: `2px solid ${on ? ctx.theme.accent : ctx.theme.border}`,
                borderRadius: 18, padding: '18px 8px', cursor: 'pointer',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
              }}>
                <div style={{ fontSize: Math.round(20 * v.mult), fontWeight: 900 }}>가</div>
                <div style={{ fontSize: fz(ctx, 17), fontWeight: 700 }}>{v.label}</div>
              </button>
            );
          })}
        </div>

        <SectionHeader ctx={ctx} text="음성 안내" />
        <SettingsRow ctx={ctx} label="음성으로 읽어주기 버튼 보이기"
          right={<Switch ctx={ctx} on={ctx.voiceVisible} onChange={v => ctx.setVoiceVisible(v)} />} />

        <SectionHeader ctx={ctx} text="가족" />
        <SettingsRow ctx={ctx} label="가족에게 공유하기"
          onClick={() => ctx.go('share')}
          right={<svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke={ctx.theme.textSoft} strokeWidth="2.5" strokeLinecap="round" fill="none"/></svg>}/>
        <SettingsRow ctx={ctx} label="등록된 가족: 딸 김미영"
          right={<span style={{ fontSize: fz(ctx, 17), color: ctx.theme.accentDark, fontWeight: 700 }}>변경</span>}/>

        <div style={{ marginTop: 24, fontSize: fz(ctx, 16), color: ctx.theme.textSoft, textAlign: 'center' }}>
          오늘의 식단 · 버전 1.0
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ ctx, text }) {
  return (
    <div style={{ marginTop: 22, marginBottom: 10, fontSize: fz(ctx, 18), color: ctx.theme.textSoft, fontWeight: 700, letterSpacing: 0.4 }}>
      {text}
    </div>
  );
}

function SettingsRow({ ctx, label, right, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: ctx.theme.card, borderRadius: 18,
      border: `1.5px solid ${ctx.theme.border}`,
      padding: '18px 20px', minHeight: 68,
      marginBottom: 8,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
      cursor: onClick ? 'pointer' : 'default',
    }}>
      <div style={{ fontSize: fz(ctx, 20), fontWeight: 600, color: ctx.theme.text }}>{label}</div>
      {right}
    </div>
  );
}

function Switch({ ctx, on, onChange }) {
  return (
    <button onClick={() => onChange(!on)} style={{
      width: 64, height: 36, borderRadius: 999, border: 'none',
      background: on ? ctx.theme.accent : '#D5C9B5',
      position: 'relative', cursor: 'pointer', transition: 'background 0.2s',
    }}>
      <span style={{
        position: 'absolute', top: 3, left: on ? 31 : 3,
        width: 30, height: 30, borderRadius: '50%',
        background: '#fff', transition: 'left 0.2s',
        boxShadow: '0 2px 4px rgba(0,0,0,0.2)',
      }}/>
    </button>
  );
}

function ShareModal({ ctx, onClose }) {
  const [sent, setSent] = React.useState(false);
  const food = ctx.currentFood;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(45, 32, 23, 0.55)',
      display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
      animation: 'fadeIn 0.25s',
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        width: '100%', background: ctx.theme.bg,
        borderTopLeftRadius: 32, borderTopRightRadius: 32,
        padding: '24px 22px 32px',
        animation: 'floatUp 0.32s cubic-bezier(.2,.7,.2,1)',
      }}>
        <div style={{ width: 56, height: 5, borderRadius: 999, background: ctx.theme.border, margin: '0 auto 18px' }}/>

        {sent ? (
          <div style={{ textAlign: 'center', padding: '28px 12px' }}>
            <div style={{
              width: 96, height: 96, borderRadius: '50%', margin: '0 auto 18px',
              background: ctx.theme.accent, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
                <path d="M5 12l5 5 9-10" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <div style={{ fontSize: fz(ctx, 30), fontWeight: 800, color: ctx.theme.text }}>
              잘 보냈어요
            </div>
            <div style={{ fontSize: fz(ctx, 19), color: ctx.theme.textSoft, marginTop: 8 }}>
              딸 미영 님에게 전달했어요
            </div>
            <div style={{ marginTop: 22 }}>
              <BigButton ctx={ctx} onClick={onClose}>확인</BigButton>
            </div>
          </div>
        ) : (
          <>
            <div style={{ fontSize: fz(ctx, 26), fontWeight: 800, color: ctx.theme.text, textAlign: 'center' }}>
              가족에게 보낼까요?
            </div>
            <div style={{ fontSize: fz(ctx, 18), color: ctx.theme.textSoft, textAlign: 'center', marginTop: 6 }}>
              오늘의 추천을 알려드릴게요
            </div>

            <div style={{
              background: ctx.theme.card, borderRadius: 20,
              border: `1.5px solid ${ctx.theme.border}`,
              padding: '16px 18px', marginTop: 18,
              display: 'flex', alignItems: 'center', gap: 14,
            }}>
              <div style={{
                width: 56, height: 56, borderRadius: '50%',
                background: 'linear-gradient(135deg, #E89B5F, #C77843)',
                color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 24, fontWeight: 800,
              }}>딸</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: fz(ctx, 22), fontWeight: 800, color: ctx.theme.text }}>김미영</div>
                <div style={{ fontSize: fz(ctx, 17), color: ctx.theme.textSoft }}>010-1234-5678</div>
              </div>
              <div style={{
                width: 32, height: 32, borderRadius: '50%',
                background: ctx.theme.accent, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 20, fontWeight: 800,
              }}>✓</div>
            </div>

            {food && (
              <div style={{
                marginTop: 14, padding: 16,
                background: ctx.theme.bgSoft, borderRadius: 20,
                display: 'flex', alignItems: 'center', gap: 14,
              }}>
                <div style={{ width: 68, height: 68 }}>
                  <FoodPhoto food={food} size="small"/>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: fz(ctx, 16), color: ctx.theme.textSoft, fontWeight: 600 }}>오늘의 추천</div>
                  <div style={{ fontSize: fz(ctx, 21), fontWeight: 800, color: ctx.theme.text }}>{food.name}</div>
                </div>
              </div>
            )}

            <div style={{ marginTop: 22, display: 'flex', flexDirection: 'column', gap: 10 }}>
              <BigButton ctx={ctx} onClick={() => setSent(true)}>보내기</BigButton>
              <BigButton ctx={ctx} variant="secondary" onClick={onClose}>취소</BigButton>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// app.jsx
// ═══════════════════════════════════════════════════════════════

const TWEAK_DEFAULTS = {
  "fontKey": "large",
  "paletteKey": "beige",
  "buttonShape": "round",
  "resultLayout": "text",
  "voiceVisible": true
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [screen, setScreen]   = React.useState('home');
  const [showShare, setShare] = React.useState(false);

  const [currentFood, setCurrentFood] = React.useState(null);
  const [history, setHistory] = React.useState(HISTORY);

  const [health, setHealth] = React.useState({
    conditions: ['bp'],
    bp: 132,
    sugar: 108,
  });

  const go = (s) => {
    if (s === 'share') { setShare(true); return; }
    setScreen(s);
  };

  const recommend = () => {
    setScreen('loading');
    const pool = FOODS.filter(f => f.id !== currentFood?.id);
    const next = pool[Math.floor(Math.random() * pool.length)];
    setTimeout(() => {
      setCurrentFood(next);
      setHistory(prev => prev.map((h, i) =>
        i === 0 ? { ...h, foodId: next.id } : h
      ));
      setScreen('result');
    }, 1500);
  };

  const openFood = (food) => {
    setCurrentFood(food);
    setScreen('result');
  };

  const theme    = PALETTES[t.paletteKey];
  const fontMult = SIZE_SCALE[t.fontKey].mult;

  const ctx = {
    theme, fontMult, fontKey: t.fontKey, setFontKey: (k) => setTweak('fontKey', k),
    buttonShape: t.buttonShape,
    resultLayout: t.resultLayout,
    voiceVisible: t.voiceVisible, setVoiceVisible: (v) => setTweak('voiceVisible', v),
    go, recommend, openFood,
    currentFood, history,
    health, setHealth,
  };

  React.useEffect(() => {
    document.body.style.background = '#26211b';
    document.body.style.fontFamily = "'Noto Sans KR', system-ui, sans-serif";
  }, []);

  return (
    <div style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
      <AndroidDevice width={412} height={892}>
        <div style={{
          width: '100%', height: '100%',
          fontFamily: "'Noto Sans KR', system-ui, sans-serif",
          color: theme.text,
          background: theme.bg,
          position: 'relative', overflow: 'hidden',
        }}>
          {screen === 'home'     && <HomeScreen     ctx={ctx} />}
          {screen === 'loading'  && <LoadingScreen  ctx={ctx} />}
          {screen === 'result'   && <ResultScreen   ctx={ctx} />}
          {screen === 'detail'   && <DetailScreen   ctx={ctx} />}
          {screen === 'history'  && <HistoryScreen  ctx={ctx} />}
          {screen === 'health'   && <HealthScreen   ctx={ctx} />}
          {screen === 'settings' && <SettingsScreen ctx={ctx} />}

          {showShare && <ShareModal ctx={ctx} onClose={() => setShare(false)} />}
        </div>
      </AndroidDevice>

      <TweaksPanel title="Tweaks">
        <TweakSection label="글씨 크기" />
        <TweakRadio
          label="크기"
          value={t.fontKey}
          options={[
            { label: '보통', value: 'normal' },
            { label: '크게', value: 'large' },
            { label: '아주 크게', value: 'xlarge' },
          ]}
          onChange={(v) => setTweak('fontKey', v)}
        />

        <TweakSection label="색감" />
        <TweakColor
          label="팔레트"
          value={[theme.bg, theme.accent, theme.accentDark]}
          options={[
            ['#F5EBDD', '#E89B5F', '#C77843'],
            ['#FAF3E7', '#D88A55', '#B36F3E'],
            ['#FBE8D6', '#E5916A', '#C26F4B'],
          ]}
          onChange={(v) => {
            const idx = ['#F5EBDD','#FAF3E7','#FBE8D6'].indexOf(v[0]);
            setTweak('paletteKey', ['beige','cream','apricot'][idx] || 'beige');
          }}
        />

        <TweakSection label="버튼 모양" />
        <TweakRadio
          label="모양"
          value={t.buttonShape}
          options={[
            { label: '원형', value: 'round' },
            { label: '사각', value: 'square' },
          ]}
          onChange={(v) => setTweak('buttonShape', v)}
        />

        <TweakSection label="결과 레이아웃" />
        <TweakRadio
          label="배치"
          value={t.resultLayout}
          options={[
            { label: '사진 위주', value: 'photo' },
            { label: '글자 위주', value: 'text' },
          ]}
          onChange={(v) => setTweak('resultLayout', v)}
        />

        <TweakSection label="음성 안내" />
        <TweakToggle
          label="음성 버튼 표시"
          value={t.voiceVisible}
          onChange={(v) => setTweak('voiceVisible', v)}
        />

        <TweakSection label="화면 이동 (체험용)" />
        <TweakButton label="메인" onClick={() => { setScreen('home'); setShare(false); }} />
        <TweakButton label="결과 화면 미리보기" onClick={() => {
          setCurrentFood(FOODS[0]);
          setScreen('result');
          setShare(false);
        }} />
        <TweakButton label="상세 화면" onClick={() => {
          if (!currentFood) setCurrentFood(FOODS[0]);
          setScreen('detail');
          setShare(false);
        }} />
        <TweakButton label="기록 화면" onClick={() => { setScreen('history'); setShare(false); }} />
        <TweakButton label="건강정보 화면" onClick={() => { setScreen('health'); setShare(false); }} />
        <TweakButton label="설정 화면" onClick={() => { setScreen('settings'); setShare(false); }} />
        <TweakButton label="공유 모달 열기" onClick={() => {
          if (!currentFood) setCurrentFood(FOODS[0]);
          setShare(true);
        }} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
