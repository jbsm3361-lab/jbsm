<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>정보창고</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
      system-ui, Roboto, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    color: #0A0A0A;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at top left, #2a1f3d 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, #1f2a3d 0%, transparent 50%),
      #0a0a0a;
  }
  #frame-wrap {
    transform-origin: center center;
  }
  /* hide scrollbar inside the device */
  #frame-wrap *::-webkit-scrollbar { display: none; }
  button { font-family: inherit; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame-wrap">
      <div id="root"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    const PHONE_W = 402, PHONE_H = 874;

    function Root() {
      return (
        <IOSDevice width={PHONE_W} height={PHONE_H}>
          <App />
        </IOSDevice>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

    // scale to fit viewport
    function fit() {
      const wrap = document.getElementById('frame-wrap');
      const pad = 40;
      const sw = (window.innerWidth - pad) / PHONE_W;
      const sh = (window.innerHeight - pad) / PHONE_H;
      const s = Math.min(sw, sh, 1.05);
      wrap.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit);
    setTimeout(fit, 50);
  </script>
</body>
</html>
